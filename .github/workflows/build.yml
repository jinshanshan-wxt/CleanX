name: Build IPA

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (unsigned)
        run: |
          xcodebuild -project CleanX.xcodeproj \
            -scheme CleanX \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/CleanX.app"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry CleanX.ipa Payload
          ls -lh CleanX.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CleanX-unsigned
          path: CleanX.ipa
          retention-days: 14

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: CleanX.ipa
